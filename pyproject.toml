[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentforge-workflow-plugin"
version = "1.1.0"
description = "Test rig for AgentForge orchestrator pipeline — deterministic workflow agent, step_match validation."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "pydantic>=2.0"]

[project.entry-points."agentforge.plugins"]
workflow-test = "agentforge_workflow"

[tool.hatch.build.targets.wheel]
packages = ["agentforge_workflow"]

[tool.hatch.build.targets.wheel.force-include]
"agentforge_workflow/plugin.json" = "agentforge_workflow/plugin.json"
"agentforge_workflow/agents/workflow_test_agent/AGENT.md" = "agentforge_workflow/agents/workflow_test_agent/AGENT.md"

[dependency-groups]
dev = ["pytest>=9.0", "pytest-asyncio>=1.0", "httpx>=0.28"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
